<h1>Tambah Aktiviti</h1>

<h6>Nama Aktiviti</h6>
<!-- <label for="">Nama Aktiviti</label> <br> -->
<input type="text" pInputText/> <br>

<label for="">Petunjuk Prestasi</label>
<span style="display: flex; justify-content: flex-end;">
  <p-button (click)="showDialog()" label="Tambah Petunjuk" icon="pi pi-plus" size="small"/>
</span>
<p-dialog header="Tambah Petunjuk Prestasi" [modal]="true" [(visible)]="visible" [style]="{ width: '50rem' }">
  <!-- <span class="p-text-secondary block mb-8">Update your information.</span> -->
  <div class="flex items-center gap-4 mb-4">
    <label for="jenis" class="flex-auto font-semibold w-24">Jenis</label>
    <p-select [options]="petunjukPrestasiOptions" optionLabel="label" optionValue="value" class="w-full md:w-56" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="keterangan" class="font-semibold w-24">Keterangan</label>
        <textarea rows="5"cols="30" pTextarea [autoResize]="true"></textarea>
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="sasaran" class="font-semibold w-24">Sasaran Kerja</label>
        <input pInputText id="sasaran" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="pencapaian" class="font-semibold w-24">Pencapaian Sebenar</label>
        <input pInputText id="pencapaian" class="flex-auto" autocomplete="off" />
    </div>
    <div class="flex items-center gap-4 mb-8">
        <label for="ulasan" class="font-semibold w-24">Ulasan</label>
        <textarea rows="5"cols="30" pTextarea [autoResize]="true"></textarea>
      </div>
      <div class="flex justify-end gap-2">
          <p-button label="Batal" severity="secondary" (click)="visible = false" />
          <p-button label="Simpan" (click)="visible = false" />
      </div>
  </p-dialog>
  <p-table [value]="products" [tableStyle]="{ 'min-width': '25rem' }">
    <ng-template #header>
      <tr>
        <th>Jenis Petunjuk</th>
        <th>Sasaran Kerja</th>
        <th>Pencapaian Sebenar</th>
        <th>Ulasan</th>
      </tr>
    </ng-template>
    <ng-template #body let-product>
      <tr>
        <td>{{ product.jenisPetunjuk }}</td>
        <td>{{ product.sasaranKerja }}</td>
        <td>{{ product.pencapaianSebenar }}</td>
        <td>{{ product.ulasan }}</td>
      </tr>
    </ng-template>
  </p-table>

  <br>

  <label for="">Lampiran</label> <br>

    <p-button label="Batal" severity="secondary" (click)="visible = false" />
