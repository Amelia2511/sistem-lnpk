<h1>Tambah Aktiviti</h1>

<br>

<label>Nama Aktiviti</label>
<input type="text" pInputText [(ngModel)]="namaAktiviti" />

<br>
<br>

<div style="display: flex; justify-content: space-between;">
<label>Petunjuk Prestasi</label>
  <span>
<p-button display="flex" align-self="flex-end" label="Tambah Petunjuk" icon="pi pi-plus" (click)="showDialog()" ></p-button>
  </span>
</div>

<p-dialog header="Tambah Petunjuk Prestasi" [(visible)]="visible" [modal]="true" [style]="{width: '50rem'}">
  <div class="mb-4">
    <label>Jenis</label>
    <p-select [options]="petunjukPrestasiOptions" optionLabel="label" optionValue="value" [(ngModel)]="selectedPetunjukJenis"></p-select>
  </div>
  <div class="mb-4">
    <label>Keterangan</label>
    <textarea pTextarea [(ngModel)]="keterangan" rows="3"></textarea>
  </div>
  <div class="mb-4">
    <label>Sasaran Kerja</label>
    <input pInputText [(ngModel)]="sasaranKerjaDialog" />
  </div>
  <div class="mb-4">
    <label>Pencapaian Sebenar</label>
    <input pInputText [(ngModel)]="pencapaianSebenarDialog" />
  </div>
  <div class="mb-4">
    <label>Ulasan</label>
    <textarea pTextarea [(ngModel)]="ulasanDialog" rows="3"></textarea>
  </div>
  <div class="flex justify-end gap-2">
    <p-button label="Batal" severity="secondary" (click)="cancelPetunjukPrestasi()"></p-button>
    <p-button label="Simpan" (click)="savePetunjukPrestasi()"></p-button>
  </div>
</p-dialog>

<p-table [value]="petunjukPrestasiRows">
  <ng-template pTemplate="header">
    <tr>
      <th>Jenis</th>
      <th>Keterangan</th>
      <th>Sasaran Kerja</th>
      <th>Pencapaian</th>
      <th>Ulasan</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{row.jenis}}</td>
      <td>{{row.keterangan}}</td>
      <td>{{row.sasaranKerja}}</td>
      <td>{{row.pencapaianSebenar}}</td>
      <td>{{row.ulasan}}</td>
    </tr>
  </ng-template>
</p-table>


<br>
<br>

<!-- <label>Lampiran</label>
<p-fileUpload name="files[]" (onUpload)="onUpload($event)" [multiple]="true"></p-fileUpload> -->
<label>Lampiran</label>
<p-fileUpload
  name="files[]"
  [auto]="false"
  [customUpload]="true"
  [multiple]="true"
  (onAdd)="handleFileSelect($event)"
  (uploadHandler)="onCustomUpload($event)">
</p-fileUpload>

<br>

<div class="flex justify-end gap-2 mt-4">
  <p-button label="Batal" severity="secondary" (click)="onCancel()"></p-button>
  <p-button label="Simpan" (click)="onSubmit()"></p-button>
</div>
