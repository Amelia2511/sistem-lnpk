<p-breadcrumb [home]="home" [model]="items" />
<h4>Senarai Pegawai</h4><br>
<p-table class="p-datatable-customers" [value]="products" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>Nama</th>
      <th>Tarikh Mula</th>
      <th>Tarikh Akhir</th>
      <!-- <th>Tempoh Sudah Berkhidmat</th> -->
      <th>Status</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-product>
    <tr>
      <td>
        <a [routerLink]="['/maklumat-pegawai', product.id]" class="pegawai-link">
          {{ product.nama }}
        </a>

      </td>
      <td>{{ product.tarikhMulaKontrak}}</td>
      <td>{{ product.tarikhAkhirKontrak }}</td>
      <!-- <td>{{ product.tempohBerkhidmat }}</td> -->

      <td>
        <p-tag [value]="product.status"
          [severity]="product.status === 'Aktif' ? 'success' : (product.status === 'Tidak Aktif' ? 'danger' : 'secondary')">
        </p-tag>
      </td>
      <td class="button-n">
        <p-button rounded="true" variant="outlined"
          [severity]="product?.buttonOption === 'Aktifkan' ? 'success' : (product?.buttonOption === 'Boleh Dinilai' ? 'info' : 'secondary')"
          [label]="product?.buttonOption" [disabled]="!!product?.isActive" (onClick)="aktifkan(product)">
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
