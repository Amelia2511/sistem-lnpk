  <ng-template pTemplate="header">
    <tr>
      <th>Tahun Penilaian</th>
      <th>Kategori Penilaian</th>
      <th>Status</th>
      <th></th>
    </tr>
  </ng-template>
            <td>{{ product.tahunPenilaian }}</td>
            <td>{{ product.namaKategoriPenilaian }}</td>
            <td><p-tag value="{{ product.namaStatus }}" [severity]="product.namaStatus === 'Draf' ? 'warn' : null" />
            </td>
            <td><p-button (onClick)="onButtonClick()" [label]="product.namaStatus === 'Draf' ? 'Kemas kini' : 'Lihat'"
                    [rounded]="true" [severity]="product.namaStatus === 'Draf' ? 'warn' : null" size="small" /></td>
        </tr>
    </ng-template>
    <div *ngFor="let item of products">
        {{ item.tahunPenilaian }} - {{ item.namaKategoriPenilaian }} - {{ item.namaStatus }}
    </div>

</p-table>
