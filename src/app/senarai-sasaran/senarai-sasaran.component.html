  <ng-template pTemplate="header">
    <tr>
      <th>Tahun Penilaian</th>
      <th>Kategori Penilaian</th>
      <th>Status</th>
      <th></th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-product>
    <tr>
      <td>{{ product.tahunPenilaian }}</td>
      <td>{{ product.kategoriPenilaian }}</td>
      <td>
        <p-tag
          [value]="product.status"
          [severity]="product.severity">
        </p-tag>
      </td>
      <td>
        <p-button
          (click)="onButtonClick(product)"
          [label]="product.actionLabel"
          [rounded]="true"
          [severity]="product.severity"
          size="small">
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
