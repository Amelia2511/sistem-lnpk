<div class="mb-4 p-8">
  <p-breadcrumb [home]="home" [model]="items" />
  <h4>Maklumat Pegawai</h4><br>
  <ng-container *ngIf="pegawai">
    <p-table [value]="pegawai.details" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template #header>
        <p-image 
          [src]="pegawai.gambar" 
          alt="Image" 
          width="250" 
          styleClass="rounded-image">
        </p-image> 
        <span class="pegawai-name">{{ pegawai.nama }}</span>
      </ng-template>
      <ng-template #body let-product>
        <tr>
          <td><b>{{ product.label }}</b></td>
          <td>{{ product.label2 }}</td>
        </tr>
      </ng-template>
    </p-table>
  </ng-container>
</div>
