<p-card header="Penilaian Prestasi">
  <p-table [value]="penilaians" [tableStyle]="{ 'min-width': '25rem' }">
    <ng-template #header>
        <tr>
            <th>Pegawai Yang Dinilai</th>
            <th *ngIf="isPpsm" style="width: 15%;">Pegawai Penilai Pertama</th>
            <th *ngIf="isPpsm" style="width: 15%;">Pegawai Penilai Kedua</th>
            <th>Tahun Prestasi</th>
            <th>Kategori Penilaian</th>
            <th>Status</th>
            <th></th>
        </tr>
    </ng-template>

    <ng-template #body let-penilaian>
        <tr>
          <td>{{ penilaian.namaPyd }}</td>
          <td *ngIf="isPpsm">{{ penilaian.namaPpp || '-' }}</td>
          <td *ngIf="isPpsm">{{ penilaian.namaPpk || '-' }}</td>
          <td>{{ penilaian.tahunPenilaian }}</td>
          <td>{{ penilaian.kategoriPenilaian }}</td>
          <td>
            <p-tag value="{{ penilaian.namaStatus }}" [severity]="penilaian.namaStatus === 'Penilaian oleh PPP' ? 'warn' : null" />
          </td>
          <td>
            <p-button
            (onClick)="onViewPenilaian(penilaian)"
            [label]="penilaian.namaStatus === 'Penilaian oleh PPP' ? 'Kemas kini' : 'Lihat'"
            [severity]="penilaian.namaStatus === 'Penilaian oleh PPP' ? 'warn' : null"
            size="small"/>
          </td>
        </tr>
    </ng-template>
  </p-table>
</p-card>
