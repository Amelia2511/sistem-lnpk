<h2>Senarai Pegawai</h2>

<p-table [value]="products" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template pTemplate="header">
    <tr>
      <th>Nama</th>
      <th>Tarikh Mula</th>
      <th>Tarikh Akhir</th>
      <th>Tempoh Sudah Berkhidmat</th>
      <th>Status</th>
      <th>Tindakan</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-product>
    <tr>
      <td>{{ product.nama }}</td>
      <td>{{ product.tarikhMulaKontrak }}</td>
      <td>{{ product.tarikhAkhirKontrak }}</td>
      <td>{{ product.tempohBerkhidmat }}</td>

      <td>
        <p-tag 
          [value]="product.status" 
          [severity]="product.status === 'Aktif' ? 'success' : 'secondary'">
        </p-tag>
      </td>

      <td class="card flex justify-center">
        <p-button 
          rounded="true" 
          variant="outlined" 
          [severity]="product.buttonOption === 'Aktifkan' ? 'success' : 'info'" 
          (onClick)="handleButtonClick(product)">
          {{ product.buttonOption }}
        </p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
